version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: enrollment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"


  api:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: enrollment
    ports:
      - "3000:3000"
